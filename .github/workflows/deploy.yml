name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: 准备 Android Platform Tools
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'platform-tools'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $platformTools = Join-Path $extract 'platform-tools'
          Copy-Item (Join-Path $platformTools 'adb.exe') 'local-agent\adb.exe' -Force
          Copy-Item (Join-Path $platformTools 'AdbWin*.dll') 'local-agent\' -Force

      - name: 安装助手依赖
        working-directory: local-agent
        run: npm ci

      - name: 校验安装器脚本
        working-directory: local-agent
        run: npm test

      - name: 构建助手
        working-directory: local-agent
        run: npm run build

      - name: 安装 Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: 构建安装器
        shell: powershell
        run: |
          $version = node -p "require('./local-agent/package.json').version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "local-agent\installer\adb-agent.iss"

      - name: 构建便携版
        shell: powershell
        run: |
          $files = Get-ChildItem local-agent\dist -File | Where-Object { $_.Name -in @('adb-agent.exe', 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll') }
          if ($files.Count -ne 4) {
            throw '便携版缺少 ADB 运行文件。'
          }
          Compress-Archive -Path $files.FullName -DestinationPath local-agent\dist\adb-agent-portable.zip -Force

      - name: 生成安装包校验和
        shell: powershell
        run: |
          Get-FileHash local-agent\dist\adb-agent-setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  adb-agent-setup.exe" } |
            Set-Content local-agent\dist\SHA256SUMS.txt
          Get-FileHash local-agent\dist\adb-agent-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  adb-agent-portable.zip" } |
            Add-Content local-agent\dist\SHA256SUMS.txt

      - name: 上传网站下载文件
        uses: actions/upload-artifact@v4
        with:
          name: adb-agent-release
          path: |
            local-agent/dist/adb-agent-setup.exe
            local-agent/dist/adb-agent-portable.zip
            local-agent/dist/SHA256SUMS.txt
          if-no-files-found: error

  build-and-deploy:
    needs: build-agent
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 放置助手安装包
        uses: actions/download-artifact@v4
        with:
          name: adb-agent-release
          path: public/downloads

      - name: 构建
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
