name: Publish local ADB agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Install agent dependencies
        working-directory: local-agent
        run: npm ci

      - name: Build agent
        working-directory: local-agent
        run: npm run build

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "local-agent\installer\adb-agent.iss"'

      - name: Build portable archive
        shell: powershell
        run: |
          $files = Get-ChildItem local-agent\dist -File | Where-Object { $_.Name -in @('adb-agent.exe', 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll') }
          Compress-Archive -Path $files.FullName -DestinationPath local-agent\dist\adb-agent-portable.zip -Force

      - name: Generate checksums
        shell: powershell
        run: |
          Get-FileHash local-agent\dist\adb-agent-setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  adb-agent-setup.exe" } | Set-Content local-agent\dist\SHA256SUMS.txt
          Get-FileHash local-agent\dist\adb-agent-portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  adb-agent-portable.zip" } | Add-Content local-agent\dist\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            local-agent/dist/adb-agent-setup.exe
            local-agent/dist/adb-agent-portable.zip
            local-agent/dist/SHA256SUMS.txt
