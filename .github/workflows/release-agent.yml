name: Publish local ADB agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = node -p "require('./local-agent/package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag v$tagVersion does not match local-agent/package.json ($packageVersion)."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Prepare Android Platform Tools
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'platform-tools'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $platformTools = Join-Path $extract 'platform-tools'
          Copy-Item (Join-Path $platformTools 'adb.exe') 'local-agent\adb.exe' -Force
          Copy-Item (Join-Path $platformTools 'AdbWin*.dll') 'local-agent\' -Force

      - name: Install agent dependencies
        working-directory: local-agent
        run: npm ci

      - name: Validate installer script
        working-directory: local-agent
        run: npm test

      - name: Build agent
        working-directory: local-agent
        run: npm run build

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          $version = node -p "require('./local-agent/package.json').version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "local-agent\installer\adb-agent.iss"

      - name: Build portable archive
        shell: powershell
        run: |
          $files = Get-ChildItem local-agent\dist -File | Where-Object { $_.Name -in @('adb-agent.exe', 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll') }
          Compress-Archive -Path $files.FullName -DestinationPath local-agent\dist\adb-agent-portable.zip -Force

      - name: Generate checksums
        shell: powershell
        run: |
          Get-FileHash local-agent\dist\adb-agent-setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  adb-agent-setup.exe" } | Set-Content local-agent\dist\SHA256SUMS.txt
          Get-FileHash local-agent\dist\adb-agent-portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  adb-agent-portable.zip" } | Add-Content local-agent\dist\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            local-agent/dist/adb-agent-setup.exe
            local-agent/dist/adb-agent-portable.zip
            local-agent/dist/SHA256SUMS.txt
